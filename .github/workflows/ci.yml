name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a push that follows closely cancels the one before.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, locales and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version of pnpm is the one `packageManager` names in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types everywhere, same keys in every locale
        run: pnpm check
      - name: Unit tests, core and MCP tools
        run: pnpm test
